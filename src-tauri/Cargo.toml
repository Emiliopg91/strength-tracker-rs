[package]
name = "strength-tracker-rs"
version = "3.8.0"
description = "Sync your devices and track your strength training"
authors = ["Emiliopg91 <ojosdeserbio@gmail.com>"]
edition = "2024"
repository = "https://github.com/Emiliopg91/strength-tracker-rs"
categories = ["Utilities"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lints.rust]
linker_messages = "allow"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "strength_tracker_rs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "^2", features = [] }
phf_codegen = "=0.11.3"
noyalib = "^0"

[dependencies]
base64 = "^0"
bytes = "^1"
chrono = { version = "^0", features = ["serde"] }
curl-rest = "^0"
embedded-io-adapters = { version = "^0", features = ["std"] }
futures-util = "^0"
strength-tracker-rs-macros = { path = "../src-tauri-macros" }
geo-types = "^0"
gpx = "^0"
hmac = "^0.13"
keyring = { version = "^3", features = ["sync-secret-service", "crypto-rust"] }
libc = "^0"
mtp-rs = "^0"
ouroboros = "^0"
percent-encoding = "^2"
phf = { version = "=0.11.3", features = ["macros"] }
rand = "^0"
rayon = "^1"
reqwest = { version = "^0", default-features = false, features = ["native-tls", "cookies", "form", "json", "query"] }
#rusqlite_orm = { path = "../rusqlite_orm/orm", features = ["derive"] }
rusqlite_orm = { version = "^1", features = ["derive"] }
rustyfit = { version = "^0", features = ["serde"] }
semver = "^1"
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"
sha1 = "^0.11"
tauri = { version = "^2", features = ["tray-icon"] }
tauri-plugin-autostart = "^2"
tauri-plugin-log = "^2"
tauri-plugin-opener = "^2"
#tauri-rs-ts-ipc = { path = "../tauri-rs-ts-ipc" }
tauri-rs-ts-ipc = { version = "^0" }
tempfile = "^3"
thiserror = "^2"
url = "^2"
tokio = { version = "^1", features = [
    "process",
    "rt",
    "rt-multi-thread",
    "signal",
    "time",
] }
# Must match the versions wry depends on, to reach the WebKitGTK webview
gtk = "0.18"
webkit2gtk = "2.0"
# Not used directly: enables tray-icon's KSNI backend through feature unification so
# left-click events reach the app on Linux. Must match the version tauri depends on.
tray-icon = { version = "0.25", default-features = false, features = ["ksni"] }
zip = { version = "^9", default-features = false, features = ["deflate"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
opt-level = 3

[profile.dev]
opt-level = 0
debug = true
debug-assertions = true
overflow-checks = false
lto = false
panic = "abort"
codegen-units = 256
incremental = true
strip = false
